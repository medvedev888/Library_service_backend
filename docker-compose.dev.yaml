version: '3.9'

services:
  postgres:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: library_service
    volumes:
      - library_service_backend_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--requirepass", "redis_password"]
    volumes:
      - library_service_backend_redis_data:/var/lib/redis/data

  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: library_service
      RABBITMQ_DEFAULT_PASS: rabbitmq_password
    volumes:
      - library_service_backend_rabbitmq_data_library_service:/var/lib/rabbitmq/data

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio123
    command: server /data --console-address ":9001"
    volumes:
      - library_service_backend_minio_data:/data

volumes:
  library_service_backend_postgres_data:
  library_service_backend_rabbitmq_data_library_service:
  library_service_backend_minio_data:
  library_service_backend_redis_data:
